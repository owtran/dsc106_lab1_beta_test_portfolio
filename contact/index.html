<!DOCTYPE html>
<html>
    <head>
        <title> Contact </title>
        <link rel = "stylesheet" href = "../style.css">
    </head>


    <body>
        <!-- Navigation Menu -->
        <nav>
            <a href = "../index.html"> Home </a>
            <a href = "./"> Contact </a>
            <a href = "../resume/index.html"> Resume </a>
            <a href = "../projects/index.html"> Projects </a>
        </nav>

        <h1> Contact </h1>

        <!-- Form element: -->
        <form 
            action = "mailto:owtran@ucsd.edu"
            method = "POST"
            enctype = "text/plain">

        <!-- Contact form fields inside form!: -->
        <!-- Added a label too: -->
            <label> 
                Email: 
                <input
                    name = "email" type = "email" value = "test@example.com"> 
            </label>

            <label>
                Subject:
                <input 
                    name = "subject" type = "text" value = "Test Subject"> 
            </label>

            <label>
                Message: 
                <textarea name = "body"> Hello, this is a test message. </textarea>
            </label>

            <!-- Submit button: -->
            <button> Submit </button>
            
        </form>

    </body>

</html>
