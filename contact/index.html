<!DOCTYPE html>
<html>
  <head>
    <title>Contact</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
  </head>

  <body>
    <h1>Contact</h1>

    <!-- Open an email draft addressed to you. -->
    <form action="mailto:owtran@ucsd.edu">

      <!-- Subject of the email. -->
      <label>
        Subject:
        <input name="subject" type="text" value="Test Subject">
      </label>

      <!-- Body of the email. -->
      <label>
        Message:
        <textarea name="body">Hello, this is a test message.</textarea>
      </label>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
